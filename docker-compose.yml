services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: qpulse
      POSTGRES_PASSWORD: qpulse
      POSTGRES_DB: qpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
