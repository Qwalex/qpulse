# Railway config for qpulse-admin
# Dashboard: Service → Settings → Root Directory = / (repo root)
#            Config file path = apps/admin/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/admin/Dockerfile"
watchPatterns = ["apps/admin/**", "packages/shared/**"]

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
